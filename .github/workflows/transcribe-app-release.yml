name: transcribe-app

# Tags named transcribe-app-v* publish the macOS and Windows builds; branch pushes only build and verify.
on:
  push:
    tags: ["transcribe-app-v*"]
    branches: ["transcribe-app"]
    paths:
      - "native/transcribe-multiplatform-app/**"
      - ".github/workflows/transcribe-app-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: native/transcribe-multiplatform-app

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install UI dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile
      - name: UI types, lint and 95% coverage
        working-directory: ${{ env.APP_DIR }}
        run: |
          bun run tsc
          bun run lint
          bun run test
      - name: Rust format, lint and 95% coverage
        working-directory: ${{ env.APP_DIR }}
        run: |
          bun run build
          mkdir -p src-tauri/runtime
          rustup component add rustfmt clippy llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cd src-tauri
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          bash ../scripts/verify/check-rust-coverage.sh
      - name: WCAG AAA in every UI state and Core Web Vitals
        working-directory: ${{ env.APP_DIR }}
        run: |
          bunx playwright install --with-deps webkit chromium
          bun run test:a11y

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            bundles: app
          - os: windows-latest
            platform: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install UI dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile
      - name: Install the Vulkan SDK for the Radeon build of whisper.cpp
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $root = (Get-ChildItem C:\VulkanSDK | Select-Object -First 1).FullName
          "VULKAN_SDK=$root" | Out-File -Append $env:GITHUB_ENV
          "$root\Bin" | Out-File -Append $env:GITHUB_PATH
      - name: Fetch pinned speech and media tools
        shell: bash
        run: bash "$APP_DIR/scripts/release/fetch-runtime.sh" "${{ matrix.platform }}"
      - name: Build the app
        working-directory: ${{ env.APP_DIR }}
        run: bunx tauri build --bundles ${{ matrix.bundles }}
      - name: Collect the macOS build
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p out
          ditto -c -k --keepParent "$APP_DIR/src-tauri/target/release/bundle/macos/Transcribe for Resolve.app" out/Transcribe-for-Resolve-macos-arm64.zip
      - name: Collect the Windows build
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p out
          cp "$APP_DIR"/src-tauri/target/release/bundle/nsis/*-setup.exe out/Transcribe-for-Resolve-windows-x64-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transcribe-app-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/transcribe-app-v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Native macOS (Apple silicon) and Windows (x64) builds. Models are downloaded separately in the app."
