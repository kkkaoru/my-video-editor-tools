[package]
name = "transcribe-app"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Drop a video, get speaker-coloured outlined subtitles."

[lib]
name = "transcribe_app"
path = "src/lib.rs"

[[bin]]
name = "transcribe-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# One Windows distribution per GPU vendor; macOS builds use neither.
[features]
windows-geforce = []
windows-radeon = []

[dependencies]
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
thiserror = "2"
tract-onnx = "0.22"
ttf-parser = "0.25"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
unicode-segmentation = "1"
ureq = "3"
vibrato = { version = "0.5", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Debug builds exist only to run tests: full debug info would cost gigabytes per rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Tests load the real IPADIC dictionary; an unoptimized decode would take far too long.
[profile.dev.package.ruzstd]
opt-level = 3

[profile.dev.package.vibrato]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
