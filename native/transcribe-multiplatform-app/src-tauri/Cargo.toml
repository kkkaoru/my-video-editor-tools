[package]
name = "transcribe-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Drop a video, get speaker-coloured outlined subtitles for DaVinci Resolve."

[lib]
name = "transcribe_app"
path = "src/lib.rs"

[[bin]]
name = "transcribe-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
thiserror = "2"
tract-onnx = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
